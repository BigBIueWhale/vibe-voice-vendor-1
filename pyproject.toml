[project]
name = "vibe-voice-vendor"
version = "0.1.1"
description = "Secure queue-based ASR server wrapping VibeVoice-ASR-7B via vLLM"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "httpx==0.28.1",
    "cryptography==49.0.0",
    "pydantic==2.12.5",
    "python-multipart==0.0.32",
]

[project.scripts]
vvv = "client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "client", "scripts"]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "ruff==0.15.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]
vibevoice-image = [
    "diffusers==0.36.0",
]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["^VibeVoice/"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["personal_server"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
