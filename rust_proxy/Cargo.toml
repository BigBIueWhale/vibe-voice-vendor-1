[package]
name = "vvv_proxy"
version = "0.1.0"
edition = "2021"
description = "Self-contained TLS reverse proxy for VibeVoice ASR server"

[dependencies]
# Async runtime
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

# HTTP/1 transport, without a public web framework/router layer
bytes = "=1.12.1"
http = "=1.4.2"
http-body = "=1.0.1"
hyper = { version = "=1.10.1", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }

# TLS primitives
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std", "logging"] }
ring = "=0.17.14"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "logging"] }

# Self-signed certificate generation and expiry checking
rcgen = "=0.13.2"
x509-parser = "=0.17.0"
time = "=0.3.47"

# CLI argument parsing
clap = { version = "=4.5.39", features = ["derive"] }

# Logging
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.22", features = ["env-filter"] }

# SPKI pin formatting
base64 = "=0.22.1"

# Async future utilities
futures = "=0.3.32"

# Body collection for HTTP proxying
http-body-util = "=0.1.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
